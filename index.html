<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cykeltøj nu 🚴</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #e8f7ff, #ffffff);
    color: #222;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 34px;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    font-size: 18px;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.10);
}

.today {
    background: linear-gradient(135deg,#1683c5,#35a9e0);
    color: white;
    text-align: center;
    padding: 25px 20px;
}

.today h2 {
    margin: 0 0 10px;
    font-size: 25px;
}

.today .big {
    font-size: 27px;
    font-weight: bold;
}

label {
    font-weight: bold;
    display: block;
    margin-bottom: 8px;
}

input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 17px;
    background: white;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: #1683c5;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #106b9f;
}

.locationButton {
    background: #159447;
}

.locationButton:hover {
    background: #117538;
}

.weather {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.weather-box {
    background: #f1f8fc;
    padding: 15px;
    border-radius: 14px;
    text-align: center;
}

.number {
    font-size: 27px;
    font-weight: bold;
    margin-top: 5px;
}

.recommendation {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.clothes div {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    font-size: 17px;
}

.clothes div:last-child {
    border-bottom: none;
}

.loading {
    text-align: center;
    color: #666;
    font-size: 18px;
}

.small {
    color: #666;
    font-size: 14px;
    margin-top: 8px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>🚴 Cykeltøj nu</h1>

<div class="subtitle">
Hvad skal du have på til cykelturen?
</div>

<div class="card">

<label>📍 Hvor vil du cykle?</label>

<input
    id="city"
    type="text"
    placeholder="Skriv en by, fx Vejle"
>

<button onclick="getCityWeather()">
🏙️ Brug valgt by
</button>

<button class="locationButton" onclick="getMyLocation()">
📍 Brug min placering
</button>

<div class="small">
Du kan vælge din aktuelle placering eller en anden by.
</div>

</div>

<div class="card">

<label>🚴 Hvor hårdt skal du cykle?</label>

<select id="intensity">
    <option value="easy">Rolig tur</option>
    <option value="normal" selected>Normal tur</option>
    <option value="hard">Hård træning</option>
</select>

</div>

<div id="result"></div>

</div>

<script>

async function getCityWeather() {

    const city = document.getElementById("city").value.trim();

    if (!city) {
        alert("Skriv en by først 😊");
        return;
    }

    showLoading();

    try {

        const response = await fetch(
            "https://geocoding-api.open-meteo.com/v1/search?name=" +
            encodeURIComponent(city) +
            "&count=1&language=da&format=json"
        );

        const data = await response.json();

        if (!data.results || data.results.length === 0) {
            throw new Error("By ikke fundet");
        }

        const location = data.results[0];

        await getWeather(
            location.latitude,
            location.longitude,
            location.name
        );

    } catch (error) {

        showError();
    }
}


function getMyLocation() {

    if (!navigator.geolocation) {
        alert("Din browser understøtter ikke positionsbestemmelse.");
        return;
    }

    showLoading();

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            try {

                await getWeather(
                    position.coords.latitude,
                    position.coords.longitude,
                    "Min placering"
                );

            } catch (error) {

                showError();
            }
        },

        function() {

            document.getElementById("result").innerHTML = `
                <div class="card">
                    ❌ Jeg kunne ikke få adgang til din placering.
                    <br><br>
                    Tillad placering i browseren eller vælg en by.
                </div>
            `;
        }
    );
}


async function getWeather(latitude, longitude, locationName) {

    const weatherResponse = await fetch(
        "https://api.open-meteo.com/v1/forecast?" +
        "latitude=" + latitude +
        "&longitude=" + longitude +
        "&current=temperature_2m,wind_speed_10m,precipitation" +
        "&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m" +
        "&forecast_days=1" +
        "&wind_speed_unit=ms" +
        "&timezone=auto"
    );

    const weather = await weatherResponse.json();

    const current = weather.current;

    const temp = current.temperature_2m;
    const wind = current.wind_speed_10m;
    const rain = current.precipitation;

    const intensity =
        document.getElementById("intensity").value;

    const hourlyRain =
        Math.max(...weather.hourly.precipitation_probability.slice(0, 6));

    const hourlyPrecip =
        Math.max(...weather.hourly.precipitation.slice(0, 6));

    let recommendation = "";
    let clothes = [];

    /*
       Grundlag for tøj
    */

    if (temp < 5) {

        recommendation = "🥶 Koldt cykelvejr – klæd dig varmt på.";

        clothes = [
            "🧥 Varm vintercykeljakke",
            "👕 Varmt baselayer",
            "🧤 Varme cykelhandsker",
            "🧢 Hue eller varmt pandebånd",
            "👖 Lange vintercykelbukser",
            "🧦 Varme cykelsokker",
            "👟 Skoovertræk"
        ];

    } else if (temp < 10) {

        recommendation = "❄️ Køligt cykelvejr – flere lag anbefales.";

        clothes = [
            "🧥 Cykeljakke",
            "👕 Langærmet baselayer",
            "🧤 Cykelhandsker",
            "👖 Lange cykelbukser",
            "🧦 Cykelsokker",
            "👟 Skoovertræk"
        ];

    } else if (temp < 15) {

        recommendation = "🌥️ Friskt cykelvejr – brug flere lag.";

        clothes = [
            "🧥 Let cykeljakke eller vest",
            "👕 Langærmet cykeltrøje",
            "🧤 Tynde handsker",
            "👖 Lange eller 3/4 cykelbukser",
            "🧦 Cykelsokker"
        ];

    } else if (temp < 20) {

        recommendation = "🚴 Godt cykelvejr – let påklædning med mulighed for ekstra lag.";

        clothes = [
            "👕 Kortærmet cykeltrøje",
            "🦺 Let vindvest",
            "🩳 Korte cykelbukser",
            "🧤 Tynde cykelhandsker"
        ];

    } else if (temp < 25) {

        recommendation = "☀️ Dejligt cykelvejr – let cykeltøj.";

        clothes = [
            "👕 Kortærmet cykeltrøje",
            "🩳 Korte cykelbukser",
            "🧤 Lette cykelhandsker",
            "🧴 Solcreme"
        ];

    } else {

        recommendation = "🔥 Varmt cykelvejr – vælg meget let tøj.";

        clothes = [
            "👕 Meget let cykeltrøje",
            "🩳 Korte cykelbukser",
            "🧤 Lette cykelhandsker",
            "🧴 Solcreme",
            "💧 Ekstra væske"
        ];
    }


    /*
       Vind
    */

    if (wind >= 8) {

        clothes.push(
            "🌬️ Vindjakke eller vindtæt vest – kraftig vind"
        );

    } else if (wind >= 5) {

        clothes.push(
            "🌬️ Vindvest anbefales"
        );
    }


    /*
       Regn
    */

    if (hourlyRain >= 60 || hourlyPrecip > 0) {

        clothes.push(
            "🌧️ Regnjakke – der er risiko for regn"
        );

    } else if (hourlyRain >= 30) {

        clothes.push(
            "🌦️ Pak en let regnjakke"
        );
    }


    /*
       Intensitet
    */

    if (intensity === "easy") {

        clothes.push(
            "🚴 Rolig tur: vælg hellere ét ekstra lag"
        );

    } else if (intensity === "hard") {

        clothes.push(
            "🔥 Hård træning: du producerer mere varme – undgå for meget tøj"
        );
    }


    let intensityText =
        intensity === "easy"
        ? "Rolig tur"
        : intensity === "hard"
        ? "Hård træning"
        : "Normal tur";


    document.getElementById("result").innerHTML = `

        <div class="card today">

            <h2>⭐ DIT CYKELTØJ I DAG</h2>

            <div class="big">
                ${recommendation}
            </div>

        </div>


        <div class="card">

            <h2>📍 ${locationName}</h2>

            <div class="weather">

                <div class="weather-box">
                    🌡️ Temperatur
                    <div class="number">
                        ${Math.round(temp)}°C
                    </div>
                </div>

                <div class="weather-box">
                    🌬️ Vind
                    <div class="number">
                        ${Math.round(wind)} m/s
                    </div>
                </div>

                <div class="weather-box">
                    🌧️ Nedbør nu
                    <div class="number">
                        ${rain} mm
                    </div>
                </div>

                <div class="weather-box">
                    🌦️ Regnrisiko
                    <div class="number">
                        ${hourlyRain}%
                    </div>
                </div>

            </div>

        </div>


        <div class="card">

            <h2>👕 Min anbefaling</h2>

            <div class="recommendation">
                ${recommendation}
            </div>

            <div class="clothes">

                ${clothes.map(item =>
                    `<div>${item}</div>`
                ).join("")}

            </div>

            <div class="small">
                🚴 ${intensityText}
            </div>

        </div>
    `;
}


function showLoading() {

    document.getElementById("result").innerHTML = `
        <div class="card loading">
            ⏳ Henter vejret...
        </div>
    `;
}


function showError() {

    document.getElementById("result").innerHTML = `
        <div class="card">
            ❌ Jeg kunne ikke hente vejret.
            <br><br>
            Prøv igen eller vælg en by.
        </div>
    `;
}

</script>

</body>
</html>
